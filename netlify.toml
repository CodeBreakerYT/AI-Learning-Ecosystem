[build]
  publish = "Builds/WebGL"

# Unity's WebGL build ships raw (uncompressed) .wasm/.data/.js by default in
# this project (Player Settings -> Publishing Settings -> Compression Format
# = Disabled) specifically so a static host can serve it with zero custom
# Content-Encoding config - the classic Unity-WebGL-on-static-host gzip/
# brotli mismatch bug this avoids. If that setting is ever switched back to
# Gzip/Brotli, matching Content-Encoding headers would need to be added here.
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
